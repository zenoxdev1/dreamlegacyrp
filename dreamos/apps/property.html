<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Property</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --purple: #7c3aed; --purple-dark: #5b21b6; --cyan: #06b6d4; --mint: #34d399;
    --bg: #0a0a0f; --card: #13131a; --card-border: rgba(124,58,237,0.12);
    --text: #e2e8f0; --muted: #64748b; --dim: #475569; --red: #ef4444;
}
html { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100%; height: 100%; overflow: hidden; padding: 0; margin: 0; }
.app-header { display: flex; align-items: center; padding: 6px 10px; background: var(--card); border-bottom: 1px solid var(--card-border); gap: 8px; flex-shrink: 0; }
.app-header .ah-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 15px; flex: 1; }
.app-header button { background: none; border: 1px solid var(--card-border); color: var(--muted); border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; }
.app-body { overflow-y: auto; padding: 10px; height: calc(100% - 43px); }

.shop-note { background: rgba(124,58,237,.08); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.shop-note a { color: var(--purple); font-weight: 600; }

.property-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.p-icon { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
.p-info { flex: 1; min-width: 160px; }
.p-name { font-weight: 600; font-size: 14px; }
.p-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.p-btn { background: none; border: 1px solid var(--card-border); color: var(--red); border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
.empty-icon { font-size: 40px; margin-bottom: 8px; opacity: .4; display: block; }
</style></head>
<body>
<div class="app-header"><span class="ah-title">&#127968; Property</span><button onclick="loadProperties()">Refresh</button></div>
<div class="app-body" id="app-body"></div>

<script>
var bridge = (window.parent && window.parent.dlrpBridge) || window.dlrpBridge;

function formatNum(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

function loadProperties() {
    var body = document.getElementById("app-body");
    body.innerHTML = '<div class="empty-state">Loading...</div>';
    bridge.getMyProperties().then(function(properties) {
        var html = '<div class="shop-note">Want to buy property? Head to <a href="https://shop.dreamlegacyrp.xyz" target="_blank">the Shop</a> on your browser.</div>';
        if (!properties || properties.length === 0) {
            html += '<div class="empty-state"><span class="empty-icon">&#127968;</span>No properties owned yet.</div>';
            body.innerHTML = html;
            return;
        }
        for (var i = 0; i < properties.length; i++) {
            var p = properties[i];
            html += '<div class="property-card">'
                + '<div class="p-icon">&#127968;</div>'
                + '<div class="p-info">'
                + '<div class="p-name">' + bridge.esc(p.name) + '</div>'
                + '<div class="p-meta">' + bridge.esc(p.location || "") + '</div>'
                + '<div class="p-meta">Bought for $' + formatNum(p.pricePaid) + '</div>'
                + '</div>'
                + '<button class="p-btn" onclick="sellProperty(\'' + p.id + '\')">Sell</button>'
                + '</div>';
        }
        body.innerHTML = html;
    }).catch(function(err) {
        body.innerHTML = '<div class="empty-state">' + bridge.esc(err.message || "Could not load your properties.") + '</div>';
    });
}

function sellProperty(propertyId) {
    bridge.showCustomModal("Sell Property", '<p style="color:#64748b;font-size:13px;">Sell this property for 60% of its purchase price?</p>', [
        { label: "Cancel", "class": "btn", action: function() {} },
        { label: "Sell", "class": "btn", action: function() {
            bridge.sellProperty(propertyId).then(function(res) {
                bridge.updateHUD();
                bridge.notif("Property", "Sold for $" + formatNum(res.sellPrice) + ".");
                loadProperties();
            }).catch(function(err) { bridge.notif("Error", err.message || "Could not sell the property."); });
        }}
    ]);
}

if (bridge && typeof bridge.getMyProperties === "function") {
    loadProperties();
}
</script>
</body></html>
